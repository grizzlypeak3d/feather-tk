<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- The undo arrow at the size the reset buttons want. This used to be a
     cross, which next to a value reads as "remove this" rather than as "put
     it back". Drawn for this size rather than scaled down from Undo.svg: at
     eleven pixels that ring came out thinner than a pixel. -->
<svg
   width="14"
   height="14"
   viewBox="0 0 14 14"
   version="1.1"
   id="svg8"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <g id="Reset" style="fill:#f0f0f0;fill-opacity:1;stroke:none">
    <path
       id="ring"
       d="M 7,1.4 A 5.6,5.6 0 0 1 12.6,7 5.6,5.6 0 0 1 7,12.6 5.6,5.6 0 0 1 1.4,7 h 2.1 A 3.5,3.5 0 0 0 7,10.5 3.5,3.5 0 0 0 10.5,7 3.5,3.5 0 0 0 7,3.5 Z" />
    <path
       id="head"
       d="M 2.45,2.45 7,0.35 v 4.2 z" />
  </g>
</svg>
