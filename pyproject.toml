[build-system]
# nanobind is pinned to the version the super build uses: tlRender and DJV
# share types with this module, which needs the same nanobind ABI.
requires = ["scikit-build-core>=0.11", "nanobind==3.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "feather-tk"
dynamic = ["version"]
description = "A lightweight toolkit for building professional tools for film, VFX, and animation"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt", "etc/Legal/LICENSE_*.txt"]
authors = [{ name = "Contributors to the feather-tk project" }]
keywords = ["gui", "ui", "toolkit", "opengl", "sdl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/grizzlypeak3d/feather-tk"
Source = "https://github.com/grizzlypeak3d/feather-tk"
Issues = "https://github.com/grizzlypeak3d/feather-tk/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.31"
# Kept between builds, so the dependencies the configure step builds (see
# etc/Python/ftkWheelDeps.cmake) are built once per platform.
build-dir = "build-wheel/{wheel_tag}"
# One wheel for every CPython from 3.12 on.
wheel.py-api = "cp312"
# The wheel's contents come from the CMake install: the package directory
# is the install prefix, so the module, the libraries, the headers and the
# CMake package all land inside feather_tk.
wheel.install-dir = "feather_tk"
wheel.packages = []
sdist.exclude = [".github", "build-wheel", "dist"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "lib/ftk/Core/Version.h"
regex = '''(?s)FTK_VERSION_MAJOR (?P<major>\d+).*FTK_VERSION_MINOR (?P<minor>\d+).*FTK_VERSION_PATCH (?P<patch>\d+).*FTK_VERSION_DEV "(?P<dev>[^"]*)"'''
# "0.12.0-dev" normalizes to the PEP 440 "0.12.0.dev0".
result = "{major}.{minor}.{patch}{dev}"

[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux_*"
# Each runner builds its own architecture only; "auto" adds 32-bit Windows
# and Linux, which are not supported.
archs = ["native"]
build-verbosity = 1
# The runners have no OpenGL; the tests that need it skip. After them, a C++
# program is built against the installed wheel with cmake from pip, which
# checks that the CMake package in it finds its own files.
test-requires = ["cmake"]
test-command = "python {project}/tests/run-python-tests.py && python {project}/tests/wheel-consumer/check.py"
test-environment = { FTK_TESTS_NO_GL = "1" }

[tool.cibuildwheel.linux]
# What SDL3 needs at build time for X11, Wayland and audio; it loads the
# libraries themselves from the system at run time. Without the audio ones
# SDL is built with no way to play sound, and says there is no audio device.
# patchelf is for etc/Python/relocate.py.
#
# The images are AlmaLinux 8, which has no libdecor, and SDL draws the window
# decorations with it where the compositor leaves them to the application, as
# GNOME does: without it the windows there have no title bar or border. Its
# PipeWire is older than SDL builds against, and without PipeWire the sound
# on a PipeWire system goes through its PulseAudio server, whose relay adds
# two threads that are not real time between the player and the device. So
# both are built here, for their headers. Neither is in the wheel: SDL loads
# the system's, and treats what is newer than libdecor 0.1 as optional. cairo
# and pango are for libdecor's own plugin, which its build requires; PipeWire
# is built with everything that needs another library turned off.
before-all = """
set -e
dnf install -y \
    libX11-devel libXrandr-devel libXinerama-devel libXcursor-devel libXi-devel \
    mesa-libGL-devel mesa-libEGL-devel \
    wayland-devel wayland-protocols-devel libxkbcommon-devel \
    alsa-lib-devel pulseaudio-libs-devel \
    cairo-devel pango-devel \
    patchelf
/opt/python/cp312-cp312/bin/python -m pip install meson ninja
export PATH=/opt/python/cp312-cp312/bin:$PATH
curl --fail --location --retry 3 --output /tmp/libdecor.tar.gz \
    https://gitlab.freedesktop.org/libdecor/libdecor/-/archive/0.2.2/libdecor-0.2.2.tar.gz
tar -xzf /tmp/libdecor.tar.gz -C /tmp
meson setup /tmp/libdecor-build /tmp/libdecor-0.2.2 \
    --prefix=/usr --libdir=lib64 --buildtype=release \
    -Ddemo=false -Ddbus=disabled -Dgtk=disabled
ninja -C /tmp/libdecor-build install
curl --fail --location --retry 3 --output /tmp/pipewire.tar.gz \
    https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/0.3.48/pipewire-0.3.48.tar.gz
tar -xzf /tmp/pipewire.tar.gz -C /tmp
meson setup /tmp/pipewire-build /tmp/pipewire-0.3.48 \
    --prefix=/usr --libdir=lib64 --buildtype=release --auto-features=disabled \
    -Dexamples=disabled -Dtests=disabled -Dpipewire-jack=disabled \
    -Dpipewire-v4l2=disabled -Ddbus=disabled -Dsystemd-user-service=disabled \
    '-Dsession-managers=[]'
ninja -C /tmp/pipewire-build install
pkg-config --atleast-version=0.3.44 libpipewire-0.3
"""

[tool.cibuildwheel.windows]
# The DLLs the wheel has already are found through the package's bin
# directory (see feather_tk/__init__.py); only the C++ runtime is added. Its
# name is left alone, since the feather-tk DLLs import it too and are not
# rewritten.
repair-wheel-command = "delvewheel repair --ignore-existing --no-mangle-all -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }
