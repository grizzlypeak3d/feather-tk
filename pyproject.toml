[build-system]
# nanobind is pinned to the version the super build uses: tlRender and DJV
# share types with this module, which needs the same nanobind ABI.
requires = ["scikit-build-core>=0.11", "nanobind==3.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "feather-tk"
dynamic = ["version"]
description = "A lightweight toolkit for building professional tools for film, VFX, and animation"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt", "etc/Legal/LICENSE_*.txt"]
authors = [{ name = "Contributors to the feather-tk project" }]
keywords = ["gui", "ui", "toolkit", "opengl", "sdl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/grizzlypeak3d/feather-tk"
Source = "https://github.com/grizzlypeak3d/feather-tk"
Issues = "https://github.com/grizzlypeak3d/feather-tk/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.31"
# Kept between builds, so the dependencies the configure step builds (see
# etc/Python/ftkWheelDeps.cmake) are built once per platform.
build-dir = "build-wheel/{wheel_tag}"
# One wheel for every CPython from 3.12 on.
wheel.py-api = "cp312"
# The wheel's contents come from the CMake install: the package directory
# is the install prefix, so the module, the libraries, the headers and the
# CMake package all land inside feather_tk.
wheel.install-dir = "feather_tk"
wheel.packages = []
sdist.exclude = [".github", "build-wheel", "dist"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "lib/ftk/Core/Version.h"
regex = '''(?s)FTK_VERSION_MAJOR (?P<major>\d+).*FTK_VERSION_MINOR (?P<minor>\d+).*FTK_VERSION_PATCH (?P<patch>\d+).*FTK_VERSION_DEV "(?P<dev>[^"]*)"'''
# "0.12.0-dev" normalizes to the PEP 440 "0.12.0.dev0".
result = "{major}.{minor}.{patch}{dev}"

[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux_*"
# Each runner builds its own architecture only; "auto" adds 32-bit Windows
# and Linux, which are not supported.
archs = ["native"]
build-verbosity = 1
# The runners have no OpenGL; the tests that need it skip. After them, a C++
# program is built against the installed wheel with cmake from pip, which
# checks that the CMake package in it finds its own files.
test-requires = ["cmake"]
test-command = "python {project}/tests/run-python-tests.py && python {project}/tests/wheel-consumer/check.py"
test-environment = { FTK_TESTS_NO_GL = "1" }

[tool.cibuildwheel.linux]
# What SDL3 needs at build time for X11 and Wayland; it loads the libraries
# themselves from the system at run time. patchelf is for
# etc/Python/relocate.py. The images are AlmaLinux 8, which
# has no libdecor, so the Wayland windows are decorated by the compositor or
# not at all.
before-all = """
dnf install -y \
    libX11-devel libXrandr-devel libXinerama-devel libXcursor-devel libXi-devel \
    mesa-libGL-devel mesa-libEGL-devel \
    wayland-devel wayland-protocols-devel libxkbcommon-devel \
    patchelf
"""

[tool.cibuildwheel.windows]
# The DLLs the wheel has already are found through the package's bin
# directory (see feather_tk/__init__.py); only the C++ runtime is added. Its
# name is left alone, since the feather-tk DLLs import it too and are not
# rewritten.
repair-wheel-command = "delvewheel repair --ignore-existing --no-mangle-all -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }
