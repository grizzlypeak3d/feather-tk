name: CI

on: [push]

jobs:
  linux-build:
    runs-on: ubuntu-24.04

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    - uses: actions/checkout@v6
      with:
        path: ftk
        submodules: recursive

    # The installed dependencies are cached, keyed on what decides
    # them and this job's config; on a hit their build is skipped.
    - name: Restore dependencies
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: install-Debug
        key: deps-${{ runner.os }}-${{ runner.arch }}-Debug-ci-linux-${{ hashFiles('ftk/etc/SuperBuild/**', 'ftk/etc/Config/**', 'ftk/etc/Linux/sbuild.sh', 'ftk/etc/Linux/setup-gha.sh') }}

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Setup environment
      run: |
        echo "$PWD/install-Debug/bin" >> $GITHUB_PATH
        echo "PYTHONPATH=$PWD/install-Debug/lib:$PYTHONPATH" >> $GITHUB_ENV
        sh ftk/etc/Linux/setup-gha.sh

    - name: Build dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      env:
        SBUILD_STAGES: deps
      run: |
        sh ftk/etc/Linux/sbuild.sh ftk Debug ci-linux

    # Saved before the project is built and installed into the same
    # directory, so that the cache holds only the dependencies.
    - name: Save dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: install-Debug
        key: ${{ steps.deps.outputs.cache-primary-key }}

    - name: Build
      env:
        SBUILD_STAGES: project
      run: |
        sh ftk/etc/Linux/sbuild.sh ftk Debug ci-linux

    - name: Run tests
      run: |
        cd build-Debug
        xvfb-run ctest --verbose --rerun-failed --output-on-failure --timeout 600 -C Debug
    
    - name: Code coverage
      run: |
        cd build-Debug
        sh ../ftk/etc/Linux/lcov.sh


