name: CI

on: [push]

jobs:
  linux-build:
    runs-on: ubuntu-latest

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    - uses: actions/checkout@v6
      with:
        path: ftk
        submodules: recursive
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Setup environment
      run: |
        echo "$PWD/install-Debug/bin" >> $GITHUB_PATH
        echo "LD_LIBRARY_PATH=$PWD/install-Debug/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PYTHONPATH=$PWD/install-Debug/lib:$PYTHONPATH" >> $GITHUB_ENV
        sh ftk/etc/Linux/setup-gha.sh

    - name: Build
      run: |
        sh ftk/etc/Linux/sbuild.sh ftk Debug ci-linux

    - name: Run tests
      run: |
        cd build-Debug
        xvfb-run ctest --verbose --rerun-failed --output-on-failure -C Debug
    
    - name: Code coverage
      run: |
        cd build-Debug
        sh ../ftk/etc/Linux/lcov.sh

